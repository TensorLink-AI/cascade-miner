name: upstream-watch

# The GitHub-side half of scripts/sync.sh --check: compare upstream cascade
# against the revision stamped in notes/CONTRACT.md ("Last synced: ...") and
# keep a single open issue current while miner-facing files have changed.
# The operator-host half (venv reinstall) still runs via scripts/sync.sh —
# a runner cannot reinstall the library where scoring actually happens.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  ISSUE_TITLE: "cascade upstream moved — miner sync needed"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: TensorLink-AI/cascade
          path: cascade
          fetch-depth: 0
          # Falls back to the workflow token; set CASCADE_READ_TOKEN if the
          # cascade repo is private to this token.
          token: ${{ secrets.CASCADE_READ_TOKEN || github.token }}

      - name: Compare against the stamped sync revision
        id: cmp
        run: |
          set -euo pipefail
          stamp="$(sed -n 's/^Last synced:.*cascade `\([0-9a-f]*\)`.*/\1/p' notes/CONTRACT.md)"
          if [ -z "$stamp" ]; then
            echo "::error::no 'Last synced' stamp in notes/CONTRACT.md"
            exit 1
          fi
          cd cascade
          if ! git cat-file -e "$stamp^{commit}" 2>/dev/null; then
            echo "::warning::stamped revision $stamp not in cascade history (rewritten?); treating as behind"
            echo "behind=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          head="$(git rev-parse --short HEAD)"
          changed="$(git diff --name-only "$stamp"..HEAD -- \
              chain.toml decisions cascade/eval cascade/shared/config.py docs/INTERFACE.md)"
          {
            echo "stamp=$stamp"
            echo "head=$head"
            echo "changed<<EOF"
            echo "$changed"
            echo "EOF"
            echo "log<<EOF"
            git log --oneline "$stamp"..HEAD -- \
                chain.toml decisions cascade/eval cascade/shared/config.py docs/INTERFACE.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$changed" ]; then
            echo "behind=yes" >> "$GITHUB_OUTPUT"
          else
            echo "behind=no" >> "$GITHUB_OUTPUT"
            echo "current: no miner-facing changes since $stamp (head $head)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open or refresh the sync issue
        if: steps.cmp.outputs.behind != 'no'
        env:
          GH_TOKEN: ${{ github.token }}
          STAMP: ${{ steps.cmp.outputs.stamp }}
          HEAD: ${{ steps.cmp.outputs.head }}
          CHANGED: ${{ steps.cmp.outputs.changed }}
          LOG: ${{ steps.cmp.outputs.log }}
        run: |
          set -euo pipefail
          {
            echo "Miner-facing files in \`TensorLink-AI/cascade\` changed since the stamped sync"
            echo "revision \`${STAMP:-unknown}\` (upstream head \`${HEAD:-unknown}\`)."
            echo
            echo "**Changed:**"
            echo '```'
            echo "${CHANGED:-stamped revision no longer resolvable — full review needed}"
            echo '```'
            echo
            echo "**Commits:**"
            echo '```'
            echo "${LOG:-n/a}"
            echo '```'
            echo
            echo "**To sync:** run \`bash scripts/sync.sh\` on the operator host, fold the"
            echo "changes into \`notes/CONTRACT.md\`, and commit the updated stamp — this"
            echo "issue closes itself on the next run once the stamp is current."
          } > body.md
          num="$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number --jq '.[0].number // empty')"
          if [ -n "$num" ]; then
            gh issue edit "$num" --body-file body.md
          else
            gh issue create --title "$ISSUE_TITLE" --body-file body.md
          fi

      - name: Close the sync issue when current
        if: steps.cmp.outputs.behind == 'no'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          num="$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number --jq '.[0].number // empty')"
          if [ -n "$num" ]; then
            gh issue close "$num" --comment "notes/CONTRACT.md stamp is current with upstream again."
          fi
