name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The suite is offline by design (no venv, no network, no wallet);
      # numpy is the only import the tests reach.
      - run: pip install numpy
      - run: python -m unittest discover -s tests -v
