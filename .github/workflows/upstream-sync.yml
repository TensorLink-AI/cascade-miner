name: upstream-sync

# Keeps this repo's picture of the cascade competition current, automatically.
#
# Every run regenerates notes/upstream-state.json + notes/UPSTREAM.md from
# TensorLink-AI/cascade and, when they moved, pushes them to a standing branch
# and opens/refreshes ONE pull request. Facts sync themselves; prose does not —
# notes/CONTRACT.md is pinned to the snapshot by tests/test_stale_references.py,
# so a fact change that contradicts a sentence turns the PR red and names it.
#
# The suite runs HERE rather than relying on the PR's own checks: a PR opened
# with GITHUB_TOKEN does not trigger workflow runs, so the PR body carries the
# result of the run below.
#
# What this cannot do: reinstall the cascade library into the operator host's
# venv. Scoring imports come from the INSTALLED package, so a green PR still
# needs `bash scripts/sync.sh` on the box before any number is comparable.

on:
  schedule:
    # GitHub disables scheduled workflows after 60 days with no repository
    # activity, and says so only by email to the repo admin. If syncs go quiet
    # for weeks, check that this schedule is still enabled before believing
    # upstream simply did not move; workflow_dispatch re-runs it by hand.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write          # only for the self-report below when the sync breaks

env:
  SYNC_BRANCH: automation/upstream-sync
  PR_TITLE: "upstream sync: refresh the cascade state snapshot"
  BROKEN_ISSUE_TITLE: "upstream-sync is failing — the miner is flying blind"

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Checked out INSIDE the miner tree; /cascade/ is gitignored and every
      # `git add` below is explicit, so it can never land in a commit.
      - uses: actions/checkout@v4
        with:
          repository: TensorLink-AI/cascade
          path: cascade
          fetch-depth: 0
          # Falls back to the workflow token; set CASCADE_READ_TOKEN if the
          # cascade repo is private to this token.
          token: ${{ secrets.CASCADE_READ_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate the upstream snapshot
        id: gen
        run: |
          set -euo pipefail
          before="$(git rev-parse HEAD)"
          python scripts/upstream_state.py --cascade-dir cascade
          head="$(git -C cascade rev-parse --short HEAD)"
          stamp="$(sed -n 's/^Last synced:.*cascade `\([0-9a-f]*\)`.*/\1/p' notes/CONTRACT.md)"
          {
            echo "head=$head"
            echo "stamp=${stamp:-unknown}"
            echo "before=$before"
          } >> "$GITHUB_OUTPUT"

          if git diff --quiet -- notes/upstream-state.json notes/UPSTREAM.md; then
            echo "moved=no" >> "$GITHUB_OUTPUT"
            echo "current: snapshot already matches cascade $head" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "moved=yes" >> "$GITHUB_OUTPUT"
            {
              echo "diff<<SYNC_EOF"
              git diff --unified=0 -- notes/upstream-state.json | grep -E '^[+-] *"' | head -60 || true
              echo "SYNC_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

          # Miner-facing commits behind the PROSE stamp — what a human/agent
          # still has to fold into notes/CONTRACT.md by hand.
          if [ -n "${stamp:-}" ] && git -C cascade cat-file -e "$stamp^{commit}" 2>/dev/null; then
            {
              echo "log<<SYNC_EOF"
              git -C cascade log --oneline "$stamp"..HEAD -- \
                  chain.toml decisions cascade/eval cascade/shared/config.py docs/MINER.md \
                  docs/INTERFACE.md | head -40
              echo "SYNC_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Run the offline suite against the regenerated snapshot
        if: steps.gen.outputs.moved == 'yes'
        id: tests
        continue-on-error: true
        run: |
          set -uo pipefail
          pip install --quiet numpy
          python -m unittest discover -s tests 2>&1 | tail -40 > test-output.txt
          status=${PIPESTATUS[0]}
          {
            echo "result<<SYNC_EOF"
            cat test-output.txt
            echo "SYNC_EOF"
          } >> "$GITHUB_OUTPUT"
          if [ "$status" = 0 ]; then
            echo "passed=yes" >> "$GITHUB_OUTPUT"
          else
            echo "passed=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Push the snapshot and open or refresh the PR
        if: steps.gen.outputs.moved == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REV: ${{ steps.gen.outputs.head }}
          STAMP: ${{ steps.gen.outputs.stamp }}
          DIFF: ${{ steps.gen.outputs.diff }}
          LOG: ${{ steps.gen.outputs.log }}
          PASSED: ${{ steps.tests.outputs.passed }}
          TEST_OUTPUT: ${{ steps.tests.outputs.result }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The snapshot is a pure function of upstream, so it can always be
          # regenerated — but the branch may also carry hand-folded CONTRACT.md
          # commits pushed in response to an earlier run. Build ON TOP of the
          # existing branch when there is one and never force-push, so prose
          # work already on the branch survives.
          mkdir -p /tmp/sync
          cp notes/upstream-state.json notes/UPSTREAM.md /tmp/sync/
          # Switching branches with these two modified would abort the checkout;
          # the saved copies above are restored on the branch a moment later.
          git restore --source=HEAD -- notes/upstream-state.json notes/UPSTREAM.md
          git fetch origin "$SYNC_BRANCH" 2>/dev/null || true
          if git show-ref --verify --quiet "refs/remotes/origin/$SYNC_BRANCH"; then
            git checkout -B "$SYNC_BRANCH" "origin/$SYNC_BRANCH"
          else
            git checkout -B "$SYNC_BRANCH"
          fi
          cp /tmp/sync/upstream-state.json notes/upstream-state.json
          cp /tmp/sync/UPSTREAM.md notes/UPSTREAM.md

          git add notes/upstream-state.json notes/UPSTREAM.md
          if git diff --cached --quiet; then
            echo "branch already carries this snapshot — refreshing the PR body only"
          else
            git commit -m "upstream sync: cascade $HEAD_REV" \
                       -m "Regenerated by .github/workflows/upstream-sync.yml."
            git push -u origin "$SYNC_BRANCH"
          fi

          {
            echo "\`notes/upstream-state.json\` regenerated from \`TensorLink-AI/cascade\`"
            echo "at \`${HEAD_REV}\`. Values that moved:"
            echo
            echo '```diff'
            echo "${DIFF:-(no key-level diff — revision metadata only)}"
            echo '```'
            echo
            if [ "${PASSED:-no}" = "yes" ]; then
              echo "**Offline suite: PASSED.** \`notes/CONTRACT.md\` still agrees with"
              echo "every fact above, so this is a facts-only refresh — safe to merge as is."
            else
              echo "**Offline suite: FAILED — prose in \`notes/CONTRACT.md\` now contradicts"
              echo "upstream.** Fold the changes in and push to this branch before merging;"
              echo "the failing assertions name the stale sentences:"
              echo
              echo '```'
              echo "${TEST_OUTPUT:-n/a}"
              echo '```'
            fi
            echo
            if [ -n "${LOG:-}" ]; then
              echo "Miner-facing cascade commits since the prose stamp \`${STAMP}\`:"
              echo
              echo '```'
              echo "${LOG}"
              echo '```'
              echo
            fi
            echo "**On the operator host**, merging is not enough — run \`bash scripts/sync.sh\`"
            echo "to pull and **reinstall** the reference clone. Scoring imports come from the"
            echo "installed package, so an un-reinstalled venv keeps scoring with the old"
            echo "metric (CLAUDE.md Rule 3), and saved per-window components must be"
            echo "re-scored before any number is compared across this change."
            echo
            echo "When you fold the prose in, restamp \`Last synced:\` in \`notes/CONTRACT.md\`"
            echo "— that line means *prose reviewed at this revision*, which is why this bot"
            echo "never moves it."
          } > body.md

          num="$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$num" ]; then
            gh pr edit "$num" --title "$PR_TITLE — cascade $HEAD_REV" --body-file body.md
          else
            gh pr create --title "$PR_TITLE — cascade $HEAD_REV" --body-file body.md \
                         --base "${GITHUB_REF_NAME}" --head "$SYNC_BRANCH"
          fi
          cat body.md >> "$GITHUB_STEP_SUMMARY"

      # The snapshot is current, so an open sync PR has nothing left to carry
      # (its content reached the base some other way). Close it rather than let
      # an empty PR sit there looking like outstanding work.
      - name: Close a spent sync PR
        if: steps.gen.outputs.moved == 'no'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          num="$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$num" ]; then
            changed="$(gh pr view "$num" --json files --jq '.files | length')"
            if [ "$changed" = "0" ]; then
              gh pr close "$num" --comment "Snapshot is current with upstream cascade; nothing left in this PR."
            fi
          fi

      # A silent robot is the failure this whole mechanism exists to prevent:
      # "no sync PR" must not be ambiguous between "upstream is quiet" and "the
      # sync has been erroring for a fortnight". A broken run says so out loud.
      - name: Report a broken sync
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "The \`upstream-sync\` workflow failed: ${RUN_URL}"
            echo
            echo "While it is failing, no sync PR appears — and an absent PR otherwise"
            echo "reads as \"upstream has not moved\". Until this is fixed, check by hand:"
            echo
            echo '```bash'
            echo "bash scripts/sync.sh --check   # on the operator host"
            echo '```'
            echo
            echo "This issue closes itself on the next successful run."
          } > broken.md
          num="$(gh issue list --state open --search "in:title \"$BROKEN_ISSUE_TITLE\"" --json number --jq '.[0].number // empty')"
          if [ -n "$num" ]; then
            gh issue edit "$num" --body-file broken.md
          else
            gh issue create --title "$BROKEN_ISSUE_TITLE" --body-file broken.md
          fi

      - name: Clear the broken-sync report
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          num="$(gh issue list --state open --search "in:title \"$BROKEN_ISSUE_TITLE\"" --json number --jq '.[0].number // empty')"
          if [ -n "$num" ]; then
            gh issue close "$num" --comment "upstream-sync ran successfully again."
          fi
